services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeforge_postgres
    restart: always
    environment:
      POSTGRES_DB: codeforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword_prod_secure_123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_backend
    restart: always
    environment:
      ENV: production
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgrespassword_prod_secure_123!@postgres:5432/codeforge
      JWT_SECRET_KEY: prod_jwt_secret_key_secure_9876543210_codeforge_auth
      SECRET_KEY: prod_secret_key_1234567890_codeforge_foundation
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      WORKSPACE_ROOT: workspaces
      GUNICORN_WORKERS: 4
      CONTAINER_ROLE: api
    ports:
      - "8000:8000"
    volumes:
      - backend_workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  job_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_job_worker
    restart: always
    environment:
      ENV: production
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgrespassword_prod_secure_123!@postgres:5432/codeforge
      JWT_SECRET_KEY: prod_jwt_secret_key_secure_9876543210_codeforge_auth
      SECRET_KEY: prod_secret_key_1234567890_codeforge_foundation
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      WORKSPACE_ROOT: workspaces
      CONTAINER_ROLE: worker
      SKIP_MIGRATIONS: "true"
    volumes:
      - backend_workspaces:/app/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_workspaces:
